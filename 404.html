<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFFFFF">
<title>Cargando catálogo… · Excibe</title>
<style>
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#FFFFFF;color:#090909;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.sp{width:34px;height:34px;border:4px solid #E5E5E5;border-top-color:#FFD400;border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
p{margin:0;font-size:15px;color:#666666}
a{color:#090909;font-weight:700}
</style>
<script>
/* Excibe · 404.html
   Quien escanea el QR o abre excibe.online/nombre-del-negocio llega aquí (GitHub Pages sirve 404.html
   cuando la ruta no existe). Se lleva el nombre a index.html, que abre el catálogo de ese negocio.
   Si la ruta no es un enlace corto válido, va directo al inicio de sesión. */
(function () {
  try {
    var seg = decodeURIComponent((location.pathname || '').replace(/\/+$/, '').split('/').pop() || '').toLowerCase();
    var reservados = ['index', 'admin', 'api', 'app', 'login', 'registro', 'desarrollador', 'static', 'assets', 'demo'];
    var valido = seg.indexOf('.') < 0 && /^[a-z0-9][a-z0-9-]{1,28}[a-z0-9]$/.test(seg) && reservados.indexOf(seg) < 0;
    location.replace('/' + (valido ? '?ruta=' + encodeURIComponent(seg) : '') + (location.hash || ''));
  } catch (e) {
    location.replace('/');
  }
})();
</script>
</head>
<body>
<div class="sp" aria-hidden="true"></div>
<p>Cargando catálogo…</p>
<noscript><p><a href="/">Ir a Excibe</a></p></noscript>
</body>
</html>
